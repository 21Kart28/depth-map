[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depthmap"
version = "0.1.0"
description = "A reflective-questioning tool that asks open questions and analyzes each answer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "anthropic>=2.8",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/depthmap"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
